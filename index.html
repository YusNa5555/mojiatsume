<style>

.btn.go{min-height:80px}
#stage{overflow-y:auto}
#word{flex-wrap:wrap;justify-content:center}

.btn.stg.lock{opacity:.5;filter:grayscale(1)}
.btn.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.meter{display:inline-block;width:80px;height:12px;border-radius:6px;background:var(--soft);border:2px solid var(--line);overflow:hidden;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--good);transition:width .4s}
.btn.own{background:var(--soft);opacity:.7}

.hole{aspect-ratio:1;border-radius:50%;background:var(--soft);border:4px solid var(--line);font-size:clamp(44px,13vw,68px);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:inset 0 8px 0 rgba(0,0,0,.15);color:var(--ink)}
.hole.up{background:var(--card);animation:pop .3s}
.big{font-size:64px;letter-spacing:6px}
.fly{position:fixed;font-size:70px;pointer-events:none;z-index:9;transition:all .7s cubic-bezier(.5,-.3,.8,.6)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes pulse{50%{transform:scale(1.1);border-color:var(--accent)}}
</style>
</head>

function mini(){
 dots();let sc=0,t=20,alive=true,cur=-1,tok=0;
 $("#stage").innerHTML=`<div style="font-size:32px;font-weight:700">⏱ <span id="tm">20</span>　⭐ <span id="sc">0</span></div><div id="grid"></div>`;
 const cells=[];for(let i=0;i<9;i++){const c=document.createElement("button");c.className="hole";c.onclick=()=>{if(alive&&i===cur){sc++;$("#sc").textContent=sc;tone(700+Math.min(sc,12)*50,.12);c.textContent="✨";cur=-1;setTimeout(show,150)}};$("#grid").appendChild(c);cells.push(c)}
 function show(){if(!alive)return;if(cur>=0){cells[cur].textContent="";cells[cur].classList.remove("up")}cells.forEach(c=>{if(c.textContent==="✨"){c.textContent="";c.classList.remove("up")}});let n;do{n=Math.floor(Math.random()*9)}while(n===cur);cur=n;const pool=st.col.length?st.col:["🐞"];cells[n].textContent=pool[Math.floor(Math.random()*pool.length)];cells[n].classList.add("up");const my=++tok;setTimeout(()=>{if(alive&&tok===my)show()},950)}
 show();
 const iv=setInterval(()=>{t--;$("#tm").textContent=t;if(t<=0){clearInterval(iv);alive=false;end()}},1000);
 function end(){fanfare();
  $("#stage").innerHTML=`<h1>⭐ ${sc}ひき！</h1><div class="big" style="font-size:54px">🎉</div><button class="btn go" id="m2" style="background:var(--good);border-color:var(--good)">🎮 もういっかい（🪙${COST}）</button><button class="btn go" id="m3">もじあそびへ</button>`;
  if(st.coins<COST)$("#m2").style.opacity=.45;$("#m2").onclick=playMini;$("#m3").onclick=startRound;dots()}
}
function startRound(){
 const w=sh(itemsFor(st.lang)).sort((a,b)=>(st.mast[a.key]||0)-(st.mast[b.key]||0)+(Math.random()-.5)*2.5);
 order=w.slice(0,5);qi=0;next();
}
function next(){
 lock=false;dots();
 if(qi>=5)return finish();
 const it=order[qi],ch=it.t,e=it.e,sen=st.lang==="sj"||st.lang==="se";
 const sy=()=>say(it.say);let miss=false;
 $("#stage").innerHTML=`<div id="pic">${e}</div><button class="btn" id="hint" style="font-size:22px;min-height:56px;min-width:0;padding:0 24px;box-shadow:0 4px 0 var(--line)">💡 ヒント</button><div id="word"></div><div id="choices"></div>`;
 const pic=$("#pic");$("#hint").onclick=()=>{if(!sound){sound=true;$("#mute").textContent="🔊";unlock()}sy()};
 const done=()=>{
  lock=true;okSnd();pic.classList.add("pop");setTimeout(sy,(st.lang==="en"||st.lang==="se")?0:600);
  const lb=document.createElement("div");lb.style.cssText="font-size:28px;font-weight:700;text-align:center";lb.textContent=it.label;$("#stage").insertBefore(lb,$("#choices"));
  if(it.other)setTimeout(()=>say(it.other),2000);
  if(!miss)st.mast[it.key]=(st.mast[it.key]||0)+1;
  if(!st.col.includes(e))st.col.push(e);st.coins+=sen?ch.length+2:ch.length;$("#coin").textContent="🪙 "+st.coins;$("#coin").style.animation="pop .5s";
  save();fly(e,()=>{shelf(true)});
  setTimeout(()=>{qi++;next()},sen?3200:3000);
 };
 $("#word").innerHTML=ch.map(()=>`<div class="slot" style="${sen?"width:auto;min-width:56px;padding:0 8px;font-size:30px":"width:"+(ch.length>4?48:72)+"px"}"></div>`).join("");
 const pool=[...new Set(itemsFor(st.lang).flatMap(x=>x.t))].filter(c=>!ch.includes(c));
 const tiles=sh([...ch,...sh(pool).slice(0,sen?2:(ch.length<=3?3:2))]);
 const box=$("#choices");let pos=0,wr=0;
 tiles.forEach(c=>{const b=document.createElement("button");b.className="btn";b.textContent=c;if(sen){b.style.fontSize="34px";b.style.minHeight="76px"}else if(tiles.length>4){b.style.minWidth="76px";b.style.padding="0 10px";b.style.fontSize="44px";b.style.minHeight="84px"}
  b.onclick=()=>{if(lock||b.classList.contains("used"))return;if(st.lang!=="en"&&st.lang!=="se")say(c);
   if(c===ch[pos]){const s=$("#word").children[pos];s.textContent=c;s.classList.add("full");b.classList.add("used");tone(600+pos*150,.12);pos++;if(pos===ch.length)done()}
   else{miss=true;b.classList.add("ng");ngSnd();setTimeout(()=>b.classList.remove("ng"),500);wr++;if(wr>=2)[...box.children].forEach(x=>{if(x.textContent===ch[pos]&&!x.classList.contains("used"))x.classList.add("hint")})}
  };box.appendChild(b)});
}
function fly(e,cb){
 const p=$("#pic").getBoundingClientRect(),s=$("#shelf").getBoundingClientRect();
 const f=document.createElement("div");f.className="fly";f.textContent=e;
 f.style.left=(p.left+p.width/2-35)+"px";f.style.top=p.top+"px";document.body.appendChild(f);
 requestAnimationFrame(()=>{f.style.left=(s.left+s.width/2-35)+"px";f.style.top=(s.top+10)+"px";f.style.fontSize="30px"});
 setTimeout(()=>{f.remove();cb()},750);
}
function finish(){
 const b0=st.rounds||0;st.rounds=b0+1;st.stg=st.stg||{};st.stg[st.lang]=(st.stg[st.lang]||0)+1;save();
 const nu=STG.filter(x=>x[3]>b0&&x[3]<=b0+1);
 dots();
 $("#stage").innerHTML=`<h1>すごい！</h1><div class="big" style="font-size:54px">${order.map(o=>o.e).join("")}</div><div style="font-size:30px;font-weight:700">🪙 ${st.coins}</div>${nu.length?`<div style="font-size:22px;font-weight:700;color:var(--accent)">🔓 ${nu.map(x=>x[1]).join("・")} ひらいたよ！</div>`:""}<button class="btn go" id="again">もういっかい</button><button class="btn go" id="mini" style="background:var(--good);border-color:var(--good)">🐱 ねこのおせわ</button><button class="btn" id="hm" style="font-size:22px;min-height:60px">ステージえらび</button>`;
 fanfare();setTimeout(()=>say("すごい！ ごひき ゲット！"),1500);
 $("#again").onclick=startRound;$("#mini").onclick=cat;$("#hm").onclick=home;
}
$("#homeb").onclick=home;home();
</script>
</body>
</html>
