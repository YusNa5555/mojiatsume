<style>

#coin{font-size:22px;font-weight:700}

.shopgrid .btn{font-size:18px;min-height:64px;min-width:0;padding:6px;box-shadow:0 4px 0 var(--line)}
.btn.go{min-height:80px}
#stage{overflow-y:auto}
#word{flex-wrap:wrap;justify-content:center}
#homeb{font-size:26px;background:none;border:0;padding:6px}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(94vw,420px)}
.btn.stg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;min-height:88px;padding:6px;font-size:16px;font-weight:700;box-shadow:0 5px 0 var(--line)}
.stg b{font-size:26px}.stg small{font-size:13px;opacity:.7}.stg span{font-size:14px}
.btn.stg.lock{opacity:.5;filter:grayscale(1)}
.btn.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.own{background:var(--soft);opacity:.7}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(92vw,380px)}
.hole{aspect-ratio:1;border-radius:50%;background:var(--soft);border:4px solid var(--line);font-size:clamp(44px,13vw,68px);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:inset 0 8px 0 rgba(0,0,0,.15);color:var(--ink)}
.hole.up{background:var(--card);animation:pop .3s}
.big{font-size:64px;letter-spacing:6px}
.fly{position:fixed;font-size:70px;pointer-events:none;z-index:9;transition:all .7s cubic-bezier(.5,-.3,.8,.6)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes pulse{50%{transform:scale(1.1);border-color:var(--accent)}}
</style>
</head>

 const rnd=(a,b)=>a+Math.random()*(b-a);
 function pick(){
  if(foods.length){A.mode='eatgo';return}
  const tmp=toys.find(o=>o.tmp);
  if((tmp&&Math.random()<.85)||(ball&&Math.random()<.25)){A.mode='chase';A.t=rnd(6,10);return}
  const r=Math.random();
  if(r<.3){A.mode='idle';A.t=rnd(2,4)}
  else if(r<.65){A.mode='walk';A.tx=rnd(-3,3);A.tz=rnd(-1,2.2)}
  else if(r<.88){A.mode='sleepgo';const s=has('bed')?BED:has('cushion')?CUS:[rnd(-2.5,2.5),rnd(-.5,1.5)];A.tx=s[0];A.tz=s[1]}
  else{A.mode='idle';A.t=2}}
 function go(x,z,sp,dt,stop){const dx=x-cg.position.x,dz=z-cg.position.z,d=Math.hypot(dx,dz);
  let df=Math.atan2(dx,dz)-cg.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));cg.rotation.y+=df*Math.min(1,dt*8);
  if(d<=stop)return true;const k=Math.min(sp*dt,d-stop)/d;cg.position.x+=dx*k;cg.position.z+=dz*k;A.wk=1;return false}
 const ray=new THREE.Raycaster(),fl=new THREE.Plane(new THREE.Vector3(0,1,0),0);
 el.addEventListener('pointerdown',e=>{const r=el.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,1-(e.clientY-r.top)/r.height*2),cam);
  if(ray.intersectObject(cg,true).length){if(A.mode==='sleep'){A.mode='idle';A.t=1.5}A.hop=1;meow();fx('\ud83d\udc95')}
  else{const p=new THREE.Vector3();if(ray.ray.intersectPlane(fl,p)&&Math.abs(p.x)<3.4&&p.z>-2&&p.z<2.6){A.mode='walk';A.tx=p.x;A.tz=p.z}}});
 const clock=new THREE.Clock();
 function loop(){if(!el.isConnected){R.dispose();try{R.forceContextLoss()}catch(e){}return}
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,s=sc();A.wk=0;
  const m=A.mode,sp=1.3*s;
  if(m==='idle'){A.t-=dt;U.hd.rotation.y=Math.sin(t*.8)*.5;if(A.t<=0)pick()}
  else if(m==='walk'){if(go(A.tx,A.tz,sp,dt,.1)){A.mode='idle';A.t=rnd(1,2.5)}}
  else if(m==='sleepgo'){if(go(A.tx,A.tz,sp,dt,.1)){A.mode='sleep';A.t=rnd(8,13);A.zz=0}}
  else if(m==='sleep'){A.t-=dt;A.zz-=dt;if(A.zz<=0){fx('\ud83d\udca4');A.zz=1.8}if(A.t<=0){A.mode='idle';A.t=1.5}}
  else if(m==='eatgo'){const f=foods[0];if(!f){A.mode='idle';A.t=1}else if(go(f.x,f.z,sp*1.4,dt,.5*s)&&f.landed){A.mode='eat';A.t=1.8}}
  else if(m==='eat'){A.t-=dt;if(A.t<=0){const f=foods.shift();if(f)S.remove(f.m);A.mode='idle';A.t=1.5;A.hop=1;meow();fx('\ud83d\udc95')}}
  else if(m==='chase'){A.t-=dt;const o=toys.find(o=>o.tmp)||ball;if(!o||A.t<=0){A.mode='idle';A.t=1.5}else if(go(o.x,o.z,sp*1.7,dt,.55*s)){const a=Math.atan2(o.x-cg.position.x,o.z-cg.position.z)+rnd(-.6,.6);o.vx=Math.sin(a)*4;o.vz=Math.cos(a)*4;A.swat=1}}
  const slT=A.mode==='sleep'?1:0;A.sl+=(slT-A.sl)*Math.min(1,dt*3);
  const hy=A.sl>.5?(has('bed')?.3:has('cushion')?.25:0):0;
  if(A.wk){A.ph+=dt*10}
  const walkY=A.wk?Math.abs(Math.sin(A.ph))*.07*s:0;
  A.hop=Math.max(0,A.hop-dt*2.2);cg.position.y+=((hy+walkY+Math.sin(A.hop*Math.PI)*.7)-cg.position.y)*Math.min(1,dt*14);
  cg.scale.setScalar(s);
  U.bd.scale.set(1+.12*A.sl,1-.38*A.sl,1+.12*A.sl);U.bd.position.y=-.05*A.sl;
  U.hd.rotation.x=.7*A.sl+(A.mode==='eat'?.4+Math.sin(t*14)*.15:0);if(A.mode!=='idle')U.hd.rotation.y*=.9;
  U.feet.forEach((f,i)=>{f.position.z=.36+(A.wk?Math.sin(A.ph+i*Math.PI)*.12:0)});
  U.tail.rotation.z=Math.sin(t*(A.wk?5:2.4))*(A.sl>.5?.08:.35);U.tail.rotation.x=A.wk?-.5:0;
  A.swat=Math.max(0,A.swat-dt*2.5);U.arms[1].rotation.x=-Math.sin(A.swat*Math.PI)*1.5;U.arms[0].rotation.x=A.wk?Math.sin(A.ph)*.4:0;if(A.wk)U.arms[1].rotation.x+=Math.sin(A.ph+Math.PI)*.4;
  A.nb-=dt;if(A.nb<0){A.blink=.14;A.nb=rnd(2,5)}A.blink-=dt;U.eyes.forEach(e=>e.scale.y=A.sl>.6||A.blink>0?.1:1.25);
  for(let i=toys.length-1;i>=0;i--){const o=toys[i];o.x+=o.vx*dt;o.z+=o.vz*dt;const f=Math.pow(.35,dt);o.vx*=f;o.vz*=f;
   if(Math.abs(o.x)>3.2){o.x=Math.sign(o.x)*3.2;o.vx*=-1}if(o.z<-2){o.z=-2;o.vz*=-1}if(o.z>2.6){o.z=2.6;o.vz*=-1}
   if(!o.tmp&&Math.hypot(o.vx,o.vz)<.3){o.vx+=rnd(-.4,.4);o.vz+=rnd(-.3,.3)}
   o.m.position.set(o.x,o.r,o.z);o.m.rotation.z-=o.vx*dt*3;o.m.rotation.x+=o.vz*dt*3;
   if(o.tmp){o.life-=dt;if(o.life<=0){S.remove(o.m);toys.splice(i,1)}}}
  for(const f of foods){if(!f.landed){f.y-=dt*5;if(f.y<=.12){f.y=.12;f.landed=true}f.m.position.y=f.y;f.m.rotation.z+=dt*5}}
  R.render(S,cam);requestAnimationFrame(loop)}
 loop();
 const info=()=>{const l=L(),h=C.love%5;$('#ci').textContent='\u306d\u3053 \u30ec\u30d9\u30eb '+(l+1)+'\u3000'+'\u2764\ufe0f'.repeat(h)+'\ud83e\udd0d'.repeat(5-h);dots()};
 const lack=p=>{$('#ts').textContent='\u3042\u3068 \ud83e\ude99'+(p-st.coins)+' \u305f\u308a\u306a\u3044\u3088';tone(220,.3);setTimeout(()=>{const z=$('#ts');if(z)z.textContent=''},1800)};
 const lv=b=>{if(L()>b)setTimeout(()=>{fanfare();$('#ts').textContent='\ud83c\udf89 \u304a\u304a\u304d\u304f \u306a\u3063\u305f\u3088\uff01'},700)};
 function act(cost,kind){if(st.coins<cost)return lack(cost);const b=L();st.coins-=cost;C.love++;save();
  if(kind==='food'){const x=rnd(-2,2),z=rnd(.2,1.8);foods.push({m:mk(SP,0xff9a4d,S,x,5,z,.3,.14,.14),x,z,y:5,landed:false});if(A.mode==='sleep')A.t=0;A.mode='eatgo'}
  else{const x=rnd(-2,2),z=rnd(.2,1.8);toys.push({m:mk(SP,0x9b6bff,S,x,.28,z,.28,.28,.28),x,z,vx:rnd(-1,1),vz:rnd(-1,1),r:.28,tmp:true,life:14});if(A.mode==='sleep'||A.mode==='idle'){A.mode='chase';A.t=9}}
  rebuild();info();lv(b)}
 function ctl(){const c=$('#ctl'),sm='font-size:22px;min-height:70px';
  if(!shop){c.innerHTML=`<div style='display:flex;gap:8px;flex-wrap:wrap;justify-content:center'><button class='btn' id='feed' style='${sm}'>\ud83d\udc1f \u3054\u306f\u3093 \ud83e\ude993</button><button class='btn' id='play' style='${sm}'>\ud83e\uddf6 \u3042\u305d\u3076 \ud83e\ude992</button><button class='btn' id='shopb' style='${sm}'>\ud83d\uded2 \u304a\u307f\u305b</button></div><button class='btn' id='back' style='font-size:18px;min-height:48px;box-shadow:none;margin:8px auto 0;display:block'>\u3082\u3058\u3042\u305d\u3073\u3078</button>`;
   $('#feed').onclick=()=>act(3,'food');$('#play').onclick=()=>act(2,'toy');$('#shopb').onclick=()=>{shop=true;ctl()};$('#back').onclick=startRound}
  else{c.innerHTML=`<div class='shopgrid'>${ITEMS.map(([k,n,ic,p])=>`<button class='btn ${has(k)?'own':''}' data-k='${k}'>${ic} ${n}<br>${has(k)?'\u2713 \u3082\u3063\u3066\u308b':'\ud83e\ude99'+p}</button>`).join('')}</div><button class='btn' id='sb' style='font-size:18px;min-height:48px;box-shadow:none;margin:8px auto 0;display:block'>\u3082\u3069\u308b</button>`;
   $('#sb').onclick=()=>{shop=false;ctl()};
   c.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const it=ITEMS.find(x=>x[0]===b.dataset.k);if(has(it[0]))return;if(st.coins<it[3])return lack(it[3]);const bl=L();st.coins-=it[3];C.items.push(it[0]);C.love++;save();okSnd();shop=false;rebuild();info();ctl();A.hop=1;setTimeout(meow,300);lv(bl)})}}
 info();ctl();
}
function note(fr,t,d,v=.13){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=2600;o.type="sawtooth";o.frequency.value=fr;const s=ac.currentTime+t;g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(v,s+.03);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(f).connect(g).connect(ac.destination);o.start(s);o.stop(s+d+.05)}catch(e){}}
function fanfare(){try{ac&&ac.resume()}catch(e){}[[392,0,.13],[392,.17,.13],[392,.34,.13],[523,.52,.55]].forEach(n=>note(n[0],n[1],n[2]));[523,659,784].forEach(f=>note(f,1.1,.9));[1047].forEach(f=>note(f,1.1,.9,.07))}
function playMini(){if(st.coins<COST){say("コインが たりないよ");tone(220,.3);return}st.coins-=COST;save();mini()}
function mini(){
 dots();let sc=0,t=20,alive=true,cur=-1,tok=0;
 $("#stage").innerHTML=`<div style="font-size:32px;font-weight:700">⏱ <span id="tm">20</span>　⭐ <span id="sc">0</span></div><div id="grid"></div>`;
 const cells=[];for(let i=0;i<9;i++){const c=document.createElement("button");c.className="hole";c.onclick=()=>{if(alive&&i===cur){sc++;$("#sc").textContent=sc;tone(700+Math.min(sc,12)*50,.12);c.textContent="✨";cur=-1;setTimeout(show,150)}};$("#grid").appendChild(c);cells.push(c)}
 function show(){if(!alive)return;if(cur>=0){cells[cur].textContent="";cells[cur].classList.remove("up")}cells.forEach(c=>{if(c.textContent==="✨"){c.textContent="";c.classList.remove("up")}});let n;do{n=Math.floor(Math.random()*9)}while(n===cur);cur=n;const pool=st.col.length?st.col:["🐞"];cells[n].textContent=pool[Math.floor(Math.random()*pool.length)];cells[n].classList.add("up");const my=++tok;setTimeout(()=>{if(alive&&tok===my)show()},950)}
 show();
 const iv=setInterval(()=>{t--;$("#tm").textContent=t;if(t<=0){clearInterval(iv);alive=false;end()}},1000);
 function end(){fanfare();
  $("#stage").innerHTML=`<h1>⭐ ${sc}ひき！</h1><div class="big" style="font-size:54px">🎉</div><button class="btn go" id="m2" style="background:var(--good);border-color:var(--good)">🎮 もういっかい（🪙${COST}）</button><button class="btn go" id="m3">もじあそびへ</button>`;
  if(st.coins<COST)$("#m2").style.opacity=.45;$("#m2").onclick=playMini;$("#m3").onclick=startRound;dots()}
}
function startRound(){
 const w=sh(itemsFor(st.lang)).sort((a,b)=>(st.mast[a.key]||0)-(st.mast[b.key]||0)+(Math.random()-.5)*2.5);
 order=w.slice(0,5);qi=0;next();
}
function next(){
 lock=false;dots();
 if(qi>=5)return finish();
 const it=order[qi],ch=it.t,e=it.e,sen=st.lang==="sj"||st.lang==="se";
 const sy=()=>say(it.say);let miss=false;
 $("#stage").innerHTML=`<div id="pic" role="button">${e}</div><div id="word"></div><div id="choices"></div>`;
 const pic=$("#pic");pic.onclick=sy;setTimeout(sy,350);
 const done=()=>{
  lock=true;okSnd();pic.classList.add("pop");sy();
  const lb=document.createElement("div");lb.style.cssText="font-size:28px;font-weight:700;text-align:center";lb.textContent=it.label;$("#stage").insertBefore(lb,$("#choices"));
  if(it.other)setTimeout(()=>say(it.other),1000);
  if(!miss)st.mast[it.key]=(st.mast[it.key]||0)+1;
  if(!st.col.includes(e))st.col.push(e);st.coins+=sen?ch.length+2:ch.length;$("#coin").textContent="🪙 "+st.coins;$("#coin").style.animation="pop .5s";
  save();fly(e,()=>{shelf(true)});
  setTimeout(()=>{qi++;next()},sen?2600:1700);
 };
 $("#word").innerHTML=ch.map(()=>`<div class="slot" style="${sen?"width:auto;min-width:56px;padding:0 8px;font-size:30px":"width:"+(ch.length>4?48:72)+"px"}"></div>`).join("");
 const pool=[...new Set(itemsFor(st.lang).flatMap(x=>x.t))].filter(c=>!ch.includes(c));
 const tiles=sh([...ch,...sh(pool).slice(0,sen?2:(ch.length<=3?3:2))]);
 const box=$("#choices");let pos=0,wr=0;
 tiles.forEach(c=>{const b=document.createElement("button");b.className="btn";b.textContent=c;if(sen){b.style.fontSize="34px";b.style.minHeight="76px"}
  b.onclick=()=>{if(lock||b.classList.contains("used"))return;
   if(c===ch[pos]){const s=$("#word").children[pos];s.textContent=c;s.classList.add("full");b.classList.add("used");tone(600+pos*150,.12);pos++;if(pos===ch.length)done()}
   else{miss=true;b.classList.add("ng");ngSnd();setTimeout(()=>b.classList.remove("ng"),500);wr++;if(wr>=2)[...box.children].forEach(x=>{if(x.textContent===ch[pos]&&!x.classList.contains("used"))x.classList.add("hint")})}
  };box.appendChild(b)});
}
function fly(e,cb){
 const p=$("#pic").getBoundingClientRect(),s=$("#shelf").getBoundingClientRect();
 const f=document.createElement("div");f.className="fly";f.textContent=e;
 f.style.left=(p.left+p.width/2-35)+"px";f.style.top=p.top+"px";document.body.appendChild(f);
 requestAnimationFrame(()=>{f.style.left=(s.left+s.width/2-35)+"px";f.style.top=(s.top+10)+"px";f.style.fontSize="30px"});
 setTimeout(()=>{f.remove();cb()},750);
}
function finish(){
 const b0=st.rounds||0;st.rounds=b0+1;st.stg=st.stg||{};st.stg[st.lang]=(st.stg[st.lang]||0)+1;save();
 const nu=STG.filter(x=>x[3]>b0&&x[3]<=b0+1);
 dots();
 $("#stage").innerHTML=`<h1>すごい！</h1><div class="big" style="font-size:54px">${order.map(o=>o.e).join("")}</div><div style="font-size:30px;font-weight:700">🪙 ${st.coins}</div>${nu.length?`<div style="font-size:22px;font-weight:700;color:var(--accent)">🔓 ${nu.map(x=>x[1]).join("・")} ひらいたよ！</div>`:""}<button class="btn go" id="again">もういっかい</button><button class="btn go" id="mini" style="background:var(--good);border-color:var(--good)">🐱 ねこのおせわ</button><button class="btn" id="hm" style="font-size:22px;min-height:60px">ステージえらび</button>`;
 fanfare();setTimeout(()=>say("すごい！ ごひき ゲット！"),1500);
 $("#again").onclick=startRound;$("#mini").onclick=cat;$("#hm").onclick=home;
}
$("#homeb").onclick=home;home();
</script>
