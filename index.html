<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>もじあつめ</title><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#fff3d6;--card:#fff;--ink:#2b2b2b;--accent:#ff7a59;--good:#2fae6b;--soft:#ffe3a3;--line:#f0c36a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e2338;--card:#2b3150;--ink:#f4f1e8;--accent:#ff8d6e;--good:#4cd08b;--soft:#3b4268;--line:#5a638f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e2338;--card:#2b3150;--ink:#f4f1e8;--accent:#ff8d6e;--good:#4cd08b;--soft:#3b4268;--line:#5a638f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;display:flex;flex-direction:column;overflow:hidden}
#top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;min-height:56px}
#dots{display:flex;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--soft);border:2px solid var(--line)}
.dot.on{background:var(--good);border-color:var(--good)}
.dot.now{background:var(--accent);border-color:var(--accent)}
#mute{font-size:26px;background:none;border:0;padding:6px}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:8px 16px;min-height:0}
#pic{width:min(76vw,280px);height:clamp(110px,22vh,180px);background:var(--card);border:4px solid var(--line);border-radius:28px;padding:6px;display:flex;align-items:center;justify-content:center}
#pic svg{width:100%;height:100%}
.th{display:inline-block;width:34px;height:34px;vertical-align:middle}.th svg{width:100%;height:100%}
.chart{display:grid;gap:4px;width:min(96vw,440px)}
.cc{font:inherit;font-size:clamp(16px,5.2vw,22px);font-weight:700;min-height:38px;padding:0;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.cc[data-c=""]{visibility:hidden}
.cc.hint{animation:pulse .7s infinite;background:var(--accent);color:#fff;border-color:var(--accent)}
.cc.ng{opacity:.35;animation:shake .4s}
.tab{font:inherit;font-size:15px;font-weight:700;padding:4px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
#pic.pop{animation:pop .5s}
#word{display:flex;gap:8px;min-height:80px;align-items:center}
.slot{width:72px;height:80px;border-radius:18px;border:4px dashed var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700}
.slot.full{border-style:solid;border-color:var(--good)}
#choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.btn{font:inherit;font-size:60px;font-weight:700;min-width:96px;min-height:104px;padding:0 22px;border-radius:26px;border:4px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff;animation:pop .5s}
.btn.ng{animation:shake .4s;opacity:.35}
.btn.hint{animation:pulse .7s infinite}
.btn.used{visibility:hidden}
.go{font-size:34px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);padding:0 40px}
#shelf{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:8px 12px 10px;min-height:54px;background:var(--soft);font-size:26px;max-height:30vh;overflow:auto}
#shelf span.new{animation:pop .6s}
h1{margin:0;font-size:44px}
#coin{font-size:22px;font-weight:700}
#catbox{position:relative;height:230px;display:flex;align-items:flex-end;justify-content:center}
#cat{line-height:1;cursor:pointer;transition:font-size .5s}
#cat.bounce{animation:pop .5s}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:sway 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(12deg)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#cg{transform-box:fill-box;transform-origin:50% 100%;cursor:pointer}
#cg.bounce{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-16px) scale(1.04)}}
.ball{animation:roll 3s ease-in-out infinite}
@keyframes roll{50%{transform:translateX(18px)}}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(94vw,420px)}
.shopgrid .btn{font-size:18px;min-height:64px;min-width:0;padding:6px;box-shadow:0 4px 0 var(--line)}
.btn.go{min-height:80px}
#stage{overflow-y:auto}
#word{flex-wrap:wrap;justify-content:center}
#stage>:first-child{margin-top:auto}#stage>:last-child{margin-bottom:auto}
#homeb{font-size:26px;background:none;border:0;padding:6px}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(94vw,420px)}
.btn.stg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;min-height:88px;padding:6px;font-size:16px;font-weight:700;box-shadow:0 5px 0 var(--line)}
.stg b{font-size:26px}.stg small{font-size:13px;opacity:.7}.stg span{font-size:14px}
.btn.stg.lock{opacity:.5;filter:grayscale(1)}
.btn.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.meter{display:inline-block;width:80px;height:12px;border-radius:6px;background:var(--soft);border:2px solid var(--line);overflow:hidden;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--good);transition:width .4s}
.btn.own{background:var(--soft);opacity:.7}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(92vw,380px)}
.hole{aspect-ratio:1;border-radius:50%;background:var(--soft);border:4px solid var(--line);font-size:clamp(44px,13vw,68px);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:inset 0 8px 0 rgba(0,0,0,.15);color:var(--ink)}
.hole.up{background:var(--card);animation:pop .3s}
.big{font-size:64px;letter-spacing:6px}
.fly{position:fixed;font-size:70px;pointer-events:none;z-index:9;transition:all .7s cubic-bezier(.5,-.3,.8,.6)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes pulse{50%{transform:scale(1.1);border-color:var(--accent)}}
</style>
</head>
<body>
<div id="top"><div id="dots"></div><div id="life" style="font-size:20px;letter-spacing:1px"></div><button id="homeb" aria-label="ホーム">🏠</button><div id="coin">🪙 0</div><button id="mute" aria-label="おと">🔇</button></div>
<div id="stage"></div>
<div id="shelf" aria-label="あつめたいきもの"></div>
<script>
const $=s=>document.querySelector(s);
let st={mast:{},col:[]},sound=false,lock=false,order=[],qi=0,ac=null;
let inGame=false,lives=3,curStage=1;
try{const s=JSON.parse(localStorage.getItem("moji1")||"null");if(s&&s.mast&&s.col)st=s}catch(e){}
st.coins=st.coins||0;st.lang=st.lang||"ja";const COST=15;
function save(){try{localStorage.setItem("moji1",JSON.stringify(st))}catch(e){}}
function say(t){if(!sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.volume=1;u.lang=(/^[A-Za-z]/.test(t)?"en-US":"ja-JP");u.rate=.8;u.pitch=1.25;speechSynthesis.speak(u)}catch(e){}}
function tone(fr,d=.15,t=0){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=fr;o.type="triangle";g.gain.setValueAtTime(.55,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);o.connect(g).connect(master());o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d)}catch(e){}}
const okSnd=()=>{tone(660,.12);tone(880,.12,.1);tone(1175,.25,.2)};
const ngSnd=()=>tone(220,.2);
$("#mute").onclick=()=>{sound=!sound;$("#mute").textContent=sound?"🔊":"🔇";if(sound){unlock();okSnd()}};
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function shelf(newE){$("#shelf").innerHTML=st.col.map((k,i)=>`<span class="${newE&&i==st.col.length-1?"new":""}">${ART[k]?`<i class="th">${art(k)}</i>`:k}</span>`).join("")||'<span style="font-size:16px;opacity:.7">ここに いきものが たまるよ</span>'}
function dots(){$("#life").innerHTML=inGame?"❤️".repeat(Math.max(lives,0))+"🖤".repeat(3-Math.max(lives,0)):"";$("#coin").textContent="🪙 "+st.coins;$("#dots").innerHTML=[...Array((order&&order.length)||5).keys()].map(i=>`<div class="dot ${i<qi?"on":i==qi?"now":""}"></div>`).join("")}
const sv=(i,vb='0 0 100 100')=>`<svg viewBox='${vb}' xmlns='http://www.w3.org/2000/svg'>${i}</svg>`;
const fc=(y=38,dx=9)=>`<circle cx='${50-dx}' cy='${y}' r='3.4' fill='#222'/><circle cx='${50+dx}' cy='${y}' r='3.4' fill='#222'/><circle cx='${51-dx}' cy='${y-1.2}' r='1.1' fill='#fff'/><circle cx='${51+dx}' cy='${y-1.2}' r='1.1' fill='#fff'/>`;
const mo=(y=52)=>`<path d='M45 ${y}q5 4.5 10 0' stroke='#5a3318' stroke-width='1.8' fill='none' stroke-linecap='round'/>`;
const ns=(y=47,c='#e8728a')=>`<ellipse cx='50' cy='${y}' rx='3.4' ry='2.6' fill='${c}'/>`;
const EAR={
 p:c=>`<path d='M30 30L31 9L46 21ZM70 30L69 9L54 21Z' fill='${c}'/><path d='M33 26L33.5 15L42 21ZM67 26L66.5 15L58 21Z' fill='#ffb6c1'/>`,
 r:(c,d,s)=>`<circle cx='32' cy='22' r='8.5' fill='${c}'/><circle cx='68' cy='22' r='8.5' fill='${c}'/><circle cx='32' cy='22' r='4.2' fill='${s}'/><circle cx='68' cy='22' r='4.2' fill='${s}'/>`,
 R:(c,d)=>`<circle cx='31' cy='22' r='9' fill='${d}'/><circle cx='69' cy='22' r='9' fill='${d}'/>`,
 f:(c,d)=>`<ellipse cx='29' cy='38' rx='7.5' ry='16' fill='${d}' transform='rotate(12 29 38)'/><ellipse cx='71' cy='38' rx='7.5' ry='16' fill='${d}' transform='rotate(-12 71 38)'/>`,
 h:(c,d)=>`<path d='M33 22L27 8M67 22L73 8' stroke='#efe2bd' stroke-width='5' stroke-linecap='round'/><ellipse cx='26' cy='34' rx='8' ry='4.5' fill='${d}' transform='rotate(20 26 34)'/><ellipse cx='74' cy='34' rx='8' ry='4.5' fill='${d}' transform='rotate(-20 74 34)'/>`,
 q:(c,d,s)=>`<path d='M30 27L27 11L43 20ZM70 27L73 11L57 20Z' fill='${s}'/>`,
 m:(c,d,s)=>`<circle cx='25' cy='40' r='9.5' fill='${c}'/><circle cx='75' cy='40' r='9.5' fill='${c}'/><circle cx='25' cy='40' r='5.5' fill='${s}'/><circle cx='75' cy='40' r='5.5' fill='${s}'/>`,
 k:c=>`<circle cx='27' cy='26' r='12' fill='${c}'/><circle cx='73' cy='26' r='12' fill='${c}'/><circle cx='27' cy='26' r='6.5' fill='#fff'/><circle cx='73' cy='26' r='6.5' fill='#fff'/>`,
 l:c=>`<circle cx='50' cy='40' r='31' fill='#b5651d'/><circle cx='31' cy='20' r='7' fill='${c}'/><circle cx='69' cy='20' r='7' fill='${c}'/>`
};
const an=(c,d,e,s,x='',pre='')=>pre+`<ellipse cx='50' cy='70' rx='25' ry='20' fill='${c}' stroke='#00000026' stroke-width='1.3'/><ellipse cx='36' cy='89' rx='8.5' ry='5' fill='${d}'/><ellipse cx='64' cy='89' rx='8.5' ry='5' fill='${d}'/>`+EAR[e](c,d,s)+`<circle cx='50' cy='40' r='22' fill='${c}' stroke='#00000026' stroke-width='1.3'/><ellipse cx='50' cy='49' rx='11' ry='8' fill='${s}'/>`+fc()+mo()+x;
const ART={
 cat:c=>an(c||'#f2a65a','#c4742a','p','#fff1da',ns()+`<path d='M40 50l-13-2M40 53l-13 3M60 50l13-2M60 53l13 3' stroke='#6b4a2a' stroke-width='1.2'/><path d='M50 20v6M43 22l1 5M57 22l-1 5' stroke='#0003' stroke-width='2' stroke-linecap='round'/>`,`<path d='M72 74Q94 70 90 46' stroke='${c||'#f2a65a'}' stroke-width='7' fill='none' stroke-linecap='round'/>`),
 dog:c=>an(c||'#d9a066','#8a5a2b','f','#fff1da',ns(46,'#333')+`<path d='M48 54q2 7 4 0z' fill='#ff7b94'/>`,`<path d='M74 74Q92 66 88 54' stroke='${c||'#d9a066'}' stroke-width='6' fill='none' stroke-linecap='round'/>`),
 bear:c=>an(c||'#9a6b3f','#7a4f2a','r','#e8c9a0',ns(46,'#3a2a1a')),
 cow:()=>an('#fff','#444','h','#ffc0cb',`<circle cx='45' cy='49' r='1.3' fill='#b04060'/><circle cx='55' cy='49' r='1.3' fill='#b04060'/><ellipse cx='37' cy='30' rx='6' ry='5' fill='#333'/><ellipse cx='66' cy='70' rx='7' ry='6' fill='#333'/><ellipse cx='36' cy='68' rx='6' ry='5' fill='#333'/>`),
 pig:()=>an('#ffb6c1','#ff8fa3','q','#ff8fa3',`<circle cx='46' cy='49' r='1.7' fill='#b04060'/><circle cx='54' cy='49' r='1.7' fill='#b04060'/>`,`<path d='M74 72q10-2 8 6q-2 5-8 2' stroke='#ff8fa3' stroke-width='3' fill='none'/>`),
 sheep:()=>`<g fill='#f6f6f6' stroke='#ddd' stroke-width='1.5'><circle cx='32' cy='66' r='14'/><circle cx='68' cy='66' r='14'/><circle cx='50' cy='62' r='16'/><circle cx='40' cy='76' r='13'/><circle cx='60' cy='76' r='13'/></g><ellipse cx='38' cy='90' rx='4' ry='6' fill='#555'/><ellipse cx='62' cy='90' rx='4' ry='6' fill='#555'/><ellipse cx='30' cy='42' rx='8' ry='4' fill='#4a4a4a' transform='rotate(20 30 42)'/><ellipse cx='70' cy='42' rx='8' ry='4' fill='#4a4a4a' transform='rotate(-20 70 42)'/><circle cx='50' cy='22' r='10' fill='#f6f6f6' stroke='#ddd' stroke-width='1.5'/><ellipse cx='50' cy='42' rx='16' ry='19' fill='#4a4a4a'/><circle cx='43' cy='40' r='3' fill='#fff'/><circle cx='57' cy='40' r='3' fill='#fff'/><circle cx='43.5' cy='40' r='1.4'/><circle cx='56.5' cy='40' r='1.4'/><ellipse cx='50' cy='50' rx='3' ry='2' fill='#e8728a'/>`,
 lion:()=>an('#f0b45a','#c98a30','l','#fff1da',ns(47,'#6b3a1a')),
 panda:()=>an('#fff','#222','R','#fff',`<ellipse cx='40' cy='38' rx='5.5' ry='7.5' fill='#222' transform='rotate(20 40 38)'/><ellipse cx='60' cy='38' rx='5.5' ry='7.5' fill='#222' transform='rotate(-20 60 38)'/><circle cx='40.5' cy='38' r='2.4' fill='#fff'/><circle cx='59.5' cy='38' r='2.4' fill='#fff'/><circle cx='40.5' cy='38' r='1.1'/><circle cx='59.5' cy='38' r='1.1'/>`+ns(47,'#222')+`<ellipse cx='28' cy='66' rx='6' ry='12' fill='#222' transform='rotate(20 28 66)'/><ellipse cx='72' cy='66' rx='6' ry='12' fill='#222' transform='rotate(-20 72 66)'/>`),
 monkey:()=>an('#a0693c','#7a4f2a','m','#f1c9a0',`<circle cx='46' cy='48' r='1' fill='#5a3318'/><circle cx='54' cy='48' r='1' fill='#5a3318'/>`,`<path d='M74 76Q98 72 92 46' stroke='#a0693c' stroke-width='6' fill='none' stroke-linecap='round'/>`),
 gorilla:()=>an('#4a4a52','#2f2f35','m','#8b8b95',`<circle cx='46' cy='48' r='1.2' fill='#222'/><circle cx='54' cy='48' r='1.2' fill='#222'/>`),
 hippo:()=>an('#8f9bb3','#6f7b93','r','#aab4c8',`<ellipse cx='50' cy='53' rx='20' ry='13' fill='#aab4c8' stroke='#00000026' stroke-width='1.3'/><circle cx='42' cy='50' r='2' fill='#445'/><circle cx='58' cy='50' r='2' fill='#445'/><path d='M40 60q10 5 20 0' stroke='#5a6478' stroke-width='1.8' fill='none' stroke-linecap='round'/>`),
 koala:()=>an('#b0b0b8','#8a8a92','k','#ddd',`<ellipse cx='50' cy='46' rx='5' ry='7' fill='#222'/>`),
 turtle:()=>`<ellipse cx='50' cy='64' rx='32' ry='24' fill='#5aa65a'/><path d='M28 60h44M40 44v40M60 44v40' stroke='#3d7d3d' stroke-width='2.5' fill='none'/><circle cx='88' cy='60' r='9' fill='#9ccc65'/><circle cx='91' cy='57' r='2' fill='#222'/><ellipse cx='30' cy='88' rx='8' ry='5' fill='#9ccc65'/><ellipse cx='68' cy='88' rx='8' ry='5' fill='#9ccc65'/><path d='M18 70l-10 3' stroke='#9ccc65' stroke-width='4' stroke-linecap='round'/>`,
 octopus:()=>`<path d='M30 56q-8 14 0 28M40 60q-4 16 2 28M50 62v28M60 60q4 16-2 28M70 56q8 14 0 28' stroke='#ff7b5c' stroke-width='8' fill='none' stroke-linecap='round'/><circle cx='50' cy='40' r='27' fill='#ff7b5c'/><circle cx='38' cy='26' r='3' fill='#fff' opacity='.5'/><circle cx='40' cy='40' r='6' fill='#fff'/><circle cx='60' cy='40' r='6' fill='#fff'/><circle cx='41' cy='41' r='3' fill='#222'/><circle cx='61' cy='41' r='3' fill='#222'/><path d='M44 54q6 5 12 0' stroke='#a8321a' stroke-width='2' fill='none' stroke-linecap='round'/><circle cx='26' cy='52' r='3' fill='#ffb3a0'/><circle cx='74' cy='52' r='3' fill='#ffb3a0'/>`,
 elephant:()=>`<ellipse cx='50' cy='72' rx='28' ry='19' fill='#9fa8b3' stroke='#00000026' stroke-width='1.3'/><ellipse cx='34' cy='90' rx='9' ry='5' fill='#7d8793'/><ellipse cx='66' cy='90' rx='9' ry='5' fill='#7d8793'/><ellipse cx='22' cy='42' rx='14' ry='19' fill='#8b95a1' stroke='#00000026' stroke-width='1.3'/><ellipse cx='78' cy='42' rx='14' ry='19' fill='#8b95a1' stroke='#00000026' stroke-width='1.3'/><ellipse cx='22' cy='43' rx='8' ry='12' fill='#c9a4ad' opacity='.7'/><ellipse cx='78' cy='43' rx='8' ry='12' fill='#c9a4ad' opacity='.7'/><circle cx='50' cy='42' r='22' fill='#9fa8b3' stroke='#00000026' stroke-width='1.3'/><path d='M40 60q-5 8 1 13M60 60q5 8-1 13' stroke='#fff' stroke-width='4' fill='none' stroke-linecap='round'/><path d='M50 50Q50 72 60 78' stroke='#7f8a97' stroke-width='12' fill='none' stroke-linecap='round'/><path d='M50 50Q50 72 60 78' stroke='#9fa8b3' stroke-width='8' fill='none' stroke-linecap='round'/><circle cx='42' cy='38' r='3.2' fill='#222'/><circle cx='58' cy='38' r='3.2' fill='#222'/><circle cx='43' cy='37' r='1' fill='#fff'/><circle cx='59' cy='37' r='1' fill='#fff'/>`,

}
function next(){
 clearTimeout(window._idle);lock=false;dots();
 if(qi>=order.length)return finish();
 const it=order[qi],ch=it.t,sen=!!it.chunks,artS=it.art||art(it.k);
 const sy=()=>say(it.say);let miss=false,pos=0,hlf=null;
 $('#stage').innerHTML=`<div id="pic" ${sen?'style="height:clamp(100px,17vh,140px)"':''}>${artS}</div><button class="btn" id="hint" style="font-size:22px;min-height:52px;min-width:0;padding:0 24px;box-shadow:0 4px 0 var(--line)">💡 ヒント</button><div id="word"></div><div id="choices"></div>`;
 $('#hint').onclick=()=>{if(!sound){sound=true;$('#mute').textContent='🔊';unlock()}sy();if(hlf)hlf()};
 const slots=()=>[...document.querySelectorAll('#word .slot')];
 const done=()=>{
  lock=true;clearTimeout(window._idle);okSnd();$('#pic').classList.add('pop');setTimeout(sy,(st.lang==='en'||st.lang==='se')?0:600);
  const lb=document.createElement('div');lb.style.cssText='font-size:26px;font-weight:700;text-align:center';lb.textContent=it.label;$('#stage').insertBefore(lb,$('#choices'));
  if(!miss)st.mast[it.key]=(st.mast[it.key]||0)+1;
  if(!st.col.includes(it.k))st.col.push(it.k);st.coins+=sen?Math.ceil(ch.length/2)+2:ch.length;$('#coin').textContent='🪙 '+st.coins;$('#coin').style.animation='pop .5s';
  save();fly(artS,()=>{shelf(true)});
  setTimeout(()=>{qi++;next()},sen?3600:3000);
 };
 const wrong=b=>{miss=true;b.dataset.bad=1;b.classList.add('ng');setTimeout(()=>{delete b.dataset.bad;b.classList.remove('ng')},700);ngSnd();lives--;dots();if(lives<=0){lock=true;clearTimeout(window._idle);setTimeout(gameOver,700);return false}return true};
 const box=$('#choices');
 if(!sen){
  $('#word').innerHTML=ch.map(()=>`<div class="slot" style="width:${ch.length>4?48:72}px"></div>`).join('');
  const pool=[...new Set(itemsFor(st.lang).flatMap(x=>x.t))].filter(c=>!ch.includes(c));
  const tiles=sh([...ch,...sh(pool).slice(0,Math.min(8,3+Math.floor((curStage-1)/4)))]);
  let wr=0;
  tiles.forEach(c=>{const b=document.createElement('button');b.className='btn';b.textContent=c;
   if(tiles.length>10){b.style.minWidth='58px';b.style.padding='0 6px';b.style.fontSize='36px';b.style.minHeight='68px'}else if(tiles.length>4){b.style.minWidth='76px';b.style.padding='0 10px';b.style.fontSize='44px';b.style.minHeight='84px'}
   b.onclick=()=>{if(lock||b.dataset.bad||b.classList.contains('used'))return;if(st.lang!=='en')say(c);
    if(c===ch[pos]){const s=slots()[pos];s.textContent=c;s.classList.add('full');b.classList.add('used');tone(600+pos*100,.12);pos++;if(pos===ch.length)done()}
    else{if(!wrong(b))return;wr++;if(wr>=2)[...box.children].forEach(x=>{if(x.textContent===ch[pos]&&!x.classList.contains('used'))x.classList.add('hint')})}
   };box.appendChild(b)});
 }else{
  const n=ch.length,w=n<=6?44:n<=10?34:n<=14?28:24;
  $('#word').innerHTML=it.chunks.map(c=>`<div style="display:flex;gap:3px">${[...c].map(()=>`<div class="slot" style="width:${w}px;height:${Math.round(w*1.2)}px;font-size:${Math.round(w*.6)}px;border-width:3px;border-radius:10px"></div>`).join('')}</div>`).join('');
  const pages=st.lang==='sj'?JP:EN;let page=0,hint=false;
  const need=()=>ch[pos];
  const idle=()=>{clearTimeout(window._idle);window._idle=setTimeout(()=>{if(box.isConnected&&!lock)hl()},curStage<10?10000:curStage<20?15000:20000)};
  function draw(){const P=pages[page],rows=P[0].length;let h='';
   if(pages.length>1)h+=`<div style="display:flex;gap:6px;justify-content:center;margin-bottom:4px">${pages.map((q,i)=>`<button class="tab ${i===page?'on':''}" data-p="${i}">${i?'゛ ゜':'あ い う'}</button>`).join('')}</div>`;
   h+=`<div class="chart" style="grid-template-columns:repeat(${P.length},1fr)">`;
   for(let r=0;r<rows;r++)for(let c=0;c<P.length;c++){const x=P[c][r]||'';h+=`<button class="cc ${hint&&x&&x===need()?'hint':''}" data-c="${x}">${x}</button>`}
   box.innerHTML=h+'</div>';
   box.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{page=+b.dataset.p;draw()});
   box.querySelectorAll('.cc').forEach(b=>b.onclick=()=>tap(b.dataset.c,b))}
  function tap(c,b){if(!c||lock||b.dataset.bad)return;
   if(c===need()){const s=slots()[pos];s.textContent=c;s.classList.add('full');if(st.lang==='sj')say(c);tone(600+(pos%8)*80,.12);pos++;hint=false;draw();if(pos===ch.length)done();else idle()}
   else wrong(b)}
  function hl(){const c=need();if(c==null)return;const i=pages.findIndex(P=>P.some(col=>col.includes(c)));page=i<0?0:i;hint=true;draw()}
  hlf=hl;draw();idle();
 }
}

function fly(e,cb){
 const p=$("#pic").getBoundingClientRect(),s=$("#shelf").getBoundingClientRect();
 const f=document.createElement("div");f.className="fly";f.innerHTML=e;f.style.width="70px";f.style.height="70px";
 f.style.left=(p.left+p.width/2-35)+"px";f.style.top=p.top+"px";document.body.appendChild(f);
 requestAnimationFrame(()=>{f.style.left=(s.left+s.width/2-35)+"px";f.style.top=(s.top+10)+"px";f.style.width="34px";f.style.height="34px"});
 setTimeout(()=>{f.remove();cb()},750);
}
function finish(){
 inGame=false;const b0=st.rounds||0;st.rounds=b0+1;st.stg=st.stg||{};st.stg[st.lang]=(st.stg[st.lang]||0)+1;
 st.reach=st.reach||{};if(curStage>=(st.reach[st.lang]||1))st.reach[st.lang]=Math.min(30,curStage+1);
 const bonus=Math.max(lives,0);st.coins+=bonus;save();
 const nu=STG.filter(x=>x[3]>b0&&x[3]<=b0+1);
 dots();
 $("#stage").innerHTML=`<h1>ステージ ${curStage} クリア！</h1><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">${order.map(o=>`<i class="th" style="width:${o.chunks?96:58}px;height:${o.chunks?64:58}px">${o.art||art(o.k)}</i>`).join("")}</div><div style="font-size:24px;font-weight:700">のこりライフ ${"❤️".repeat(bonus)} → 🪙+${bonus}</div><div style="font-size:28px;font-weight:700">🪙 ${st.coins}</div>${nu.length?`<div style="font-size:22px;font-weight:700;color:var(--accent)">🔓 ${nu.map(x=>x[1]).join("・")} ひらいたよ！</div>`:""}${curStage<30?`<button class="btn go" id="next">つぎのステージ</button>`:""}<button class="btn" id="again" style="font-size:22px;min-height:60px">もういっかい</button><button class="btn go" id="mini" style="background:var(--good);border-color:var(--good)">🐱 ねこのおせわ</button><button class="btn" id="hm" style="font-size:22px;min-height:60px">ステージえらび</button>`;
 fanfare();
 if($("#next"))$("#next").onclick=()=>{curStage++;startRound()};
 $("#again").onclick=startRound;$("#mini").onclick=cat;$("#hm").onclick=()=>stageSel(st.lang);
}
$("#homeb").onclick=home;home();
</script>
</body>
</html>
